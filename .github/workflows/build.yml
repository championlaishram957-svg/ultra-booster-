name: Build ULTRA BOOSTER APK

on:
  workflow_dispatch:
  push:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - name: Install Android SDK
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Extract project
        run: |
          mkdir project
          unzip -q "$(find . -maxdepth 1 -name '*.zip' | head -n 1)" -d project

      - name: Build APK
        run: |
          chmod +x $(find project -name gradlew | head -n 1)
          cd "$(dirname "$(find "$GITHUB_WORKSPACE/project" -name gradlew | head -n 1)")"
          ./gradlew assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: ULTRA-BOOSTER-APK
          path: project/**/build/outputs/apk/debug/*.apk
